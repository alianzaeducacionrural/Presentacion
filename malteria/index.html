<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I.E. Maltería &middot; Informe Ejecutivo &middot; Modelo Escuela Nueva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF7EC;
    --paper-2:#FFFDF7;
    --ink:#1E1912;
    --muted:#6E6353;
    --rule:#E3D8BE;

    --verde:#2F6B3A;      --verde-soft:#E4F0E2;
    --ambar:#C98207;      --ambar-soft:#FBEED4;
    --teal:#1F8A82;       --teal-soft:#DCF0EE;
    --clay:#B8452B;       --clay-soft:#FAE3DB;

    --display:'Fraunces', Georgia, serif;
    --body:'Public Sans', system-ui, sans-serif;

    --r:clamp(12px,1.5dvh,20px);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:var(--body);
    color:var(--ink);
    background:var(--paper);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  img{max-width:100%;display:block;}
  p{margin:0;}
  h1,h2,h3{margin:0;font-weight:inherit;}
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left;}
  :focus-visible{outline:3px solid var(--ambar);outline-offset:3px;border-radius:6px;}

  /* ---------- Fondo vivo ---------- */
  .aura{
    position:fixed;inset:-20%;z-index:0;pointer-events:none;
    background:
      radial-gradient(42% 48% at 10% 14%, rgba(47,107,58,.07), transparent 72%),
      radial-gradient(40% 46% at 90% 90%, rgba(201,130,7,.06), transparent 72%);
  }

  /* ---------- Estructura ---------- */
  .stage{
    position:relative;z-index:1;
    height:100dvh;
    display:flex;flex-direction:column;
    gap:clamp(8px,1.3dvh,16px);
    padding:clamp(10px,1.7dvh,22px) clamp(12px,1.7vw,30px) clamp(10px,1.6dvh,20px);
  }

  /* ---------- Cabecera ---------- */
  .mast{
    flex:0 0 auto;
    display:flex;align-items:center;gap:clamp(10px,2vw,28px);
  }
  .plate{
    flex:0 0 auto;
    background:#fff;border-radius:14px;
    padding:clamp(5px,.85dvh,10px) clamp(8px,.9vw,15px);
    box-shadow:0 2px 12px -5px rgba(30,25,18,.3), 0 0 0 1px rgba(30,25,18,.05);
  }
  .plate img{height:clamp(22px,4.5dvh,42px);width:auto;}
  .mast-mid{flex:1 1 auto;text-align:center;min-width:0;}
  .eyebrow{
    font-family:var(--display);font-weight:600;
    font-size:clamp(8.5px,1.25dvh,11.5px);
    letter-spacing:.24em;text-transform:uppercase;color:var(--clay);
    margin-bottom:.35em;
  }
  .mast-mid h1{
    font-family:var(--display);font-weight:900;font-variation-settings:'opsz' 96;
    font-size:clamp(17px,3.5dvh,36px);line-height:1.02;letter-spacing:-.015em;
  }
  .mast-sub{
    margin-top:.45em;
    font-size:clamp(9.5px,1.35dvh,12.5px);
    letter-spacing:.05em;color:var(--muted);
  }

  /* ---------- Mosaico ---------- */
  .bento{
    flex:1 1 auto;min-height:0;
    display:grid;
    gap:clamp(7px,1.15dvh,15px);
    grid-template-columns:1.12fr 1fr 1fr 1.04fr;
    grid-template-rows:minmax(0,.74fr) minmax(0,1.06fr) minmax(0,1fr) minmax(0,.58fr);
    grid-template-areas:
      "pan kpi kpi kpi"
      "pan esc esc uni"
      "pan log log uni"
      "des des con con";
  }

  .tile{
    position:relative;overflow:hidden;min-height:0;min-width:0;
    display:flex;flex-direction:column;
    border-radius:var(--r);
    padding:clamp(9px,1.55dvh,20px) clamp(11px,1.15vw,22px);
    background:var(--paper-2);
    border:1px solid var(--rule);
    box-shadow:0 10px 24px -22px rgba(30,25,18,.4);
    transition:transform .22s cubic-bezier(.2,.8,.3,1), box-shadow .22s ease, border-color .22s ease;
    animation:rise .5s cubic-bezier(.2,.8,.3,1) both;
    animation-delay:calc(var(--i,0) * 55ms + 80ms);
  }
  @keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

  button.tile:hover,button.tile:focus-visible{transform:translateY(-3px);}
  button.tile:hover{box-shadow:0 20px 36px -28px rgba(30,25,18,.55);border-color:var(--accent,var(--muted));}

  .tile > *{position:relative;z-index:1;}

  .kicker{
    font-family:var(--display);font-weight:600;
    font-size:clamp(8px,1.2dvh,11px);
    letter-spacing:.2em;text-transform:uppercase;
    color:var(--accent,currentColor);opacity:.85;margin-bottom:.55em;
    display:flex;align-items:center;gap:.6em;
  }
  .kicker .dot{width:.5em;height:.5em;border-radius:50%;background:currentColor;flex:0 0 auto;}

  .tile h2{
    font-family:var(--display);font-weight:700;font-variation-settings:'opsz' 60;
    font-size:clamp(13px,2.35dvh,25px);line-height:1.08;letter-spacing:-.01em;
  }
  .tile .lead{
    margin-top:.5em;
    font-size:clamp(10px,1.5dvh,14px);line-height:1.45;
    max-width:52ch;opacity:.88;
  }

  .go{
    margin-top:auto;padding-top:.7em;
    font-family:var(--display);font-weight:600;
    font-size:clamp(8.5px,1.18dvh,11px);
    letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent,currentColor);
    opacity:.6;display:flex;align-items:center;gap:.5em;
    transition:opacity .2s ease;
  }
  .go svg{width:1em;height:1em;transition:transform .25s ease;}
  button.tile:hover .go{opacity:1;}
  button.tile:hover .go svg{transform:translateX(4px);}

  /* --- variantes de color --- */
  /* un solo bloque pleno ancla la composición; el resto vive sobre papel */
  .t-solid-verde{background:var(--verde);color:#F1F6EF;border-color:transparent;}
  button.t-solid-verde:hover{border-color:transparent;}
  .t-quiet-clay{--accent:var(--clay);}
  .t-quiet-ink{--accent:#514735;}
  .t-quiet-teal{--accent:var(--teal);}
  .t-quiet-ambar{--accent:var(--ambar);}
  .t-quiet-verde{--accent:var(--verde);}

  /* ---------- Panorama ---------- */
  .pan{grid-area:pan;}
  .pan .big{
    font-family:var(--display);font-weight:900;font-variation-settings:'opsz' 90;
    font-size:clamp(19px,3.6dvh,40px);line-height:.98;letter-spacing:-.02em;
    margin-top:.15em;
  }
  /* fortalezas: cada una como un punto propio */
  .tags{
    display:flex;flex-wrap:wrap;
    gap:clamp(5px,.7dvh,9px);margin-top:1em;
  }
  .tags span{
    display:inline-flex;align-items:center;gap:.5em;
    padding:clamp(3px,.6dvh,7px) clamp(8px,.65vw,13px);
    border-radius:999px;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
    font-size:clamp(8px,1.18dvh,11.5px);font-weight:500;line-height:1.15;
  }
  .tags span::before{
    content:"";width:.4em;height:.4em;border-radius:50%;
    background:currentColor;opacity:.55;flex:0 0 auto;
  }

  .sedes{margin-top:auto;display:flex;flex-direction:column;gap:clamp(5px,.8dvh,10px);padding-top:1.2em;}
  .sede{
    display:flex;align-items:baseline;gap:.6em;
    padding:clamp(4px,.75dvh,9px) clamp(7px,.6vw,12px);
    border-radius:10px;background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.16);
  }
  .sede b{font-family:var(--display);font-weight:700;font-size:clamp(10px,1.55dvh,14px);}
  .sede span{font-size:clamp(8.5px,1.24dvh,11.5px);opacity:.85;line-height:1.25;}

  /* ---------- KPIs ---------- */
  .kpis{
    grid-area:kpi;min-height:0;min-width:0;
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    gap:clamp(7px,1.15dvh,15px);
  }
  .kpi{
    justify-content:center;
    padding:clamp(7px,1.2dvh,16px) clamp(8px,.8vw,16px);
  }
  .kpi .num{
    font-family:var(--display);font-weight:900;font-variation-settings:'opsz' 120;
    font-size:clamp(24px,5.6dvh,58px);line-height:.9;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;
  }
  .kpi .lbl{
    margin-top:.42em;
    font-size:clamp(8.5px,1.24dvh,12px);line-height:1.24;
    color:var(--muted);font-weight:500;
  }
  .kpi .rail{height:3px;border-radius:2px;width:26%;margin-bottom:.6em;transition:width .3s ease;}
  .kpi:hover .rail{width:52%;}
  .kpi .num{color:var(--accent);}
  .kpi .rail{background:var(--accent);}
  .k-ambar{--accent:var(--ambar);}
  .k-teal {--accent:var(--teal);}
  .k-clay {--accent:var(--clay);}
  .k-verde{--accent:var(--verde);}

  /* ---------- Escuelas demostrativas ---------- */
  .esc{grid-area:esc;}
  .badges{margin-top:auto;display:flex;gap:clamp(5px,.6vw,10px);padding-top:.8em;}
  .badge{
    flex:1 1 0;min-width:0;
    border-radius:11px;padding:clamp(5px,.85dvh,11px) clamp(6px,.55vw,11px);
    background:var(--paper);border:1px solid var(--rule);
  }
  .badge .name{font-family:var(--display);font-weight:700;font-size:clamp(9.5px,1.42dvh,13px);line-height:1.1;}
  .badge .state{margin-top:.3em;font-size:clamp(8px,1.16dvh,11px);line-height:1.2;color:var(--muted);}
  .badge.on{background:var(--teal-soft);border-color:#BFE2DE;color:#123F3B;}
  .badge.on .state{color:#2A6F69;}

  /* ---------- Universidad en el Campo ---------- */
  .uni{grid-area:uni;}
  .cohorts{margin-top:auto;display:flex;flex-direction:column;gap:clamp(5px,.8dvh,10px);padding-top:1.2em;}
  .cohort{
    display:flex;align-items:center;gap:.7em;
    padding:clamp(5px,.85dvh,11px) clamp(7px,.6vw,13px);
    border-radius:11px;background:var(--paper);border:1px solid var(--rule);
  }
  .cohort .g{
    font-family:var(--display);font-weight:900;font-size:clamp(15px,2.7dvh,28px);line-height:1;
    color:var(--accent);
  }
  .cohort .t{font-size:clamp(8.5px,1.26dvh,12px);line-height:1.25;color:var(--muted);}
  .cohort .t b{color:var(--ink);}

  /* ---------- Logros ---------- */
  .log{grid-area:log;}
  .chips{
    margin-top:.7em;flex:1 1 auto;
    display:flex;flex-wrap:wrap;align-content:center;
    gap:clamp(5px,.8dvh,11px);
    min-height:0;overflow:hidden;
  }
  .hint{
    margin-top:auto;padding-top:.7em;
    font-family:var(--display);font-weight:600;
    font-size:clamp(8.5px,1.18dvh,11px);
    letter-spacing:.16em;text-transform:uppercase;opacity:.6;
  }
  .chip{
    display:inline-flex;align-items:center;gap:.45em;
    padding:clamp(4px,.72dvh,9px) clamp(7px,.62vw,13px);
    border-radius:999px;
    background:var(--paper);border:1px solid var(--rule);
    font-size:clamp(8.5px,1.28dvh,12px);font-weight:600;line-height:1.1;
    color:var(--ink);
    transition:background .18s ease,color .18s ease,transform .18s ease,border-color .18s ease;
  }
  .chip .n{font-family:var(--display);font-weight:900;color:var(--ambar);}
  .chip:hover,.chip:focus-visible{background:var(--ambar-soft);border-color:#EDD9A9;color:#5B3D06;transform:translateY(-2px);}

  /* ---------- Franja inferior ---------- */
  .des{grid-area:des;}
  .con{grid-area:con;}
  .bottom-row{flex-direction:row;align-items:center;gap:clamp(10px,1.4vw,26px);}
  .bottom-row .txt{min-width:0;flex:1 1 auto;}
  .bottom-row .lead{
    margin-top:.35em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .arrow{
    flex:0 0 auto;
    width:clamp(30px,5.2dvh,52px);height:clamp(30px,5.2dvh,52px);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--rule);color:var(--accent,var(--muted));opacity:.75;
    transition:opacity .2s ease, transform .25s ease, background .2s ease, border-color .2s ease;
  }
  .arrow svg{width:44%;height:44%;}
  button.tile:hover .arrow{opacity:1;transform:translateX(3px);border-color:var(--accent,var(--muted));}

  /* ---------- Modal ---------- */
  .modal-layer{
    position:fixed;inset:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    padding:clamp(12px,3dvh,40px) clamp(12px,4vw,48px);
    background:rgba(30,25,18,.55);
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    opacity:0;visibility:hidden;
    transition:opacity .26s ease, visibility .26s ease;
  }
  .modal-layer.open{opacity:1;visibility:visible;}
  .modal-card{
    position:relative;
    width:min(860px,100%);max-height:86dvh;overflow-y:auto;overscroll-behavior:contain;
    background:var(--paper-2);
    border-radius:clamp(14px,2dvh,24px);
    padding:clamp(20px,3.4dvh,40px) clamp(20px,3vw,46px);
    box-shadow:0 40px 80px -30px rgba(30,25,18,.7);
    border-top:6px solid var(--accent,var(--verde));
    transform:scale(.9);opacity:0;
    transition:transform .3s cubic-bezier(.2,.9,.3,1), opacity .24s ease;
  }
  .modal-layer.open .modal-card{transform:scale(1);opacity:1;}
  /* el diálogo recibe el foco por programa: no debe dibujar contorno */
  .modal-card:focus,.modal-card:focus-visible{outline:none;}

  .modal-close{
    position:absolute;top:clamp(10px,1.6dvh,18px);right:clamp(10px,1.2vw,18px);
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--rule);background:var(--paper);
    transition:background .18s ease,transform .25s ease,border-color .18s ease;
  }
  .modal-close:hover{background:var(--accent,var(--verde));border-color:transparent;transform:rotate(90deg);}
  .modal-close svg{width:15px;height:15px;stroke:var(--ink);stroke-width:2;}
  .modal-close:hover svg{stroke:#fff;}

  .m-kicker{
    font-family:var(--display);font-weight:600;font-size:11px;
    letter-spacing:.22em;text-transform:uppercase;color:var(--accent,var(--verde));
    margin-bottom:.6em;
  }
  .m-title{
    font-family:var(--display);font-weight:900;font-variation-settings:'opsz' 80;
    font-size:clamp(22px,3.4dvh,34px);line-height:1.05;letter-spacing:-.02em;
    padding-right:44px;
  }
  .m-lead{margin-top:.7em;font-size:clamp(14px,1.9dvh,17px);line-height:1.55;color:var(--muted);}
  .m-body{margin-top:1.5em;display:flex;flex-direction:column;gap:1.1em;}

  .m-table{width:100%;border-collapse:collapse;font-size:clamp(13px,1.75dvh,15.5px);}
  .m-table th,.m-table td{padding:.72em .9em;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule);line-height:1.45;}
  .m-table th{
    width:38%;font-family:var(--display);font-weight:700;color:var(--ink);
  }
  .m-table tr:last-child th,.m-table tr:last-child td{border-bottom:none;}
  .m-table tbody tr:nth-child(odd){background:rgba(227,216,190,.22);}

  .m-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.7em;}
  .m-list li{
    display:flex;gap:.75em;align-items:flex-start;
    font-size:clamp(13.5px,1.8dvh,16px);line-height:1.5;
  }
  .m-list li::before{
    content:"✔";color:var(--accent,var(--verde));font-weight:700;flex:0 0 auto;line-height:1.4;
  }

  .m-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.85em;}
  .m-card{
    border:1px solid var(--rule);border-radius:14px;padding:1em 1.1em;
    background:var(--paper);
    transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .m-card .n{
    font-family:var(--display);font-weight:900;font-size:13px;
    letter-spacing:.14em;color:var(--accent,var(--verde));margin-bottom:.4em;
  }
  .m-card h4{font-family:var(--display);font-weight:700;font-size:clamp(15px,2dvh,18px);line-height:1.15;margin:0 0 .45em;}
  .m-card p{font-size:clamp(12.5px,1.65dvh,14.5px);line-height:1.5;color:var(--muted);}
  .m-card.hit{
    border-color:var(--accent,var(--verde));
    background:#fff;
    box-shadow:0 0 0 3px color-mix(in srgb, var(--accent,var(--verde)) 18%, transparent);
  }

  .m-pills{display:flex;flex-wrap:wrap;gap:.5em;}
  .m-pill{
    padding:.42em .85em;border-radius:999px;
    background:color-mix(in srgb, var(--accent,var(--verde)) 12%, var(--paper));
    border:1px solid color-mix(in srgb, var(--accent,var(--verde)) 30%, transparent);
    font-size:clamp(11.5px,1.5dvh,13.5px);font-weight:600;
  }
  .m-note{
    font-family:var(--display);font-size:clamp(13px,1.75dvh,15.5px);line-height:1.6;
    border-left:4px solid var(--accent,var(--verde));padding-left:1em;color:var(--ink);
  }
  .m-sub{
    font-family:var(--display);font-weight:700;font-size:clamp(14px,1.9dvh,17px);
    margin-bottom:-.3em;
  }

  /* ---------- Movimiento reducido ---------- */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
  }

  /* ---------- Pantallas pequeñas / bajas ---------- */
  @media (max-width:900px), (max-height:560px){
    body{overflow:auto;}
    .stage{height:auto;min-height:100dvh;}
    .bento{
      grid-template-columns:1fr;
      grid-template-rows:none;
      grid-template-areas:"pan" "kpi" "esc" "uni" "log" "des" "con";
    }
    .tile{padding:16px 18px;}
    .pan .big{font-size:30px;}
    .tile h2{font-size:20px;}
    .tile .lead,.bottom-row .lead{font-size:14px;}
    .bottom-row .lead{-webkit-line-clamp:unset;}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr));}
    .kpi .num{font-size:40px;}
    .kpi .lbl,.sede span,.badge .state,.cohort .t,.chip{font-size:12px;}
    .mast{flex-wrap:wrap;justify-content:center;}
    .mast-mid{order:-1;flex:1 0 100%;}
    .mast-mid h1{font-size:24px;}
    .modal-card{max-height:88dvh;}
  }
</style>
</head>
<body>
<div class="aura" aria-hidden="true"></div>

<div class="stage">

  <header class="mast">
    <div class="plate"><img src="./comite-cafeteros.png" alt="Federación Nacional de Cafeteros de Colombia — Comité de Cafeteros de Caldas"></div>
    <div class="mast-mid">
      <p class="eyebrow">Informe ejecutivo &middot; 2025 &ndash; 2026</p>
      <h1>Institución Educativa Maltería</h1>
      <p class="mast-sub">Estado del Modelo de Educación Rural con Escuela Nueva &middot; Manizales</p>
    </div>
    <div class="plate"><img src="./alcaldia-manizales.png" alt="Alcaldía de Manizales — Manizales del Alma"></div>
  </header>

  <main class="bento">

    <!-- Panorama general -->
    <button class="tile pan t-solid-verde" style="--i:0" data-modal="panorama" aria-haspopup="dialog">
      <p class="kicker"><span class="dot"></span>01 · Panorama general</p>
      <h2 class="big">Alto nivel de<br>consolidación</h2>
      <p class="lead">Modelo de Educación Rural con Escuela Nueva implementado en las tres sedes.</p>
      <div class="tags">
        <span>Liderazgo directivo</span>
        <span>Acompañamiento permanente</span>
        <span>Articulación con educación superior</span>
        <span>Escuelas demostrativas</span>
      </div>
      <div class="sedes">
        <div class="sede"><b>Central</b><span>Avances hacia Escuela Demostrativa</span></div>
        <div class="sede"><b>Colonia Escolar (A)</b><span>Escuela Demostrativa consolidada</span></div>
        <div class="sede"><b>El Porvenir (B)</b><span>La Universidad en el Campo</span></div>
      </div>
      <p class="go">Ver detalle <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></p>
    </button>

    <!-- KPIs de gestión -->
    <div class="kpis">
      <button class="tile kpi k-ambar" style="--i:1" data-modal="gestion" aria-haspopup="dialog">

/* =========================================================
   Modal
   ========================================================= */
const layer = document.getElementById('layer');
const card  = document.getElementById('card');
let lastFocus = null;

function openModal(key, trigger, hit){
  const d = DATA[key];
  if(!d) return;
  lastFocus = trigger || null;

  card.style.setProperty('--accent', d.accent);
  document.getElementById('mKicker').textContent = d.kicker;
  document.getElementById('mTitle').textContent  = d.title;
  const leadEl = document.getElementById('mLead');
  leadEl.innerHTML = d.lead;
  leadEl.style.display = d.lead ? '' : 'none';
  document.getElementById('mBody').innerHTML = d.body.join('');

  // origen de la animación: la tarjeta que se pulsó
  if(trigger){
    const r = trigger.getBoundingClientRect();
    const cx = ((r.left + r.width/2)  / window.innerWidth)  * 100;
    const cy = ((r.top  + r.height/2) / window.innerHeight) * 100;
    card.style.transformOrigin = `${cx}% ${cy}%`;
  }else{
    card.style.transformOrigin = '50% 50%';
  }

  layer.classList.add('open');
  card.scrollTop = 0;
  card.focus();

  if(hit !== null && hit !== undefined){
    const target = card.querySelector(`.m-card[data-idx="${hit}"]`);
    if(target){
      target.classList.add('hit');
      requestAnimationFrame(()=> target.scrollIntoView({block:'nearest', behavior:'smooth'}));
    }
  }
}

function closeModal(){
  layer.classList.remove('open');
  if(lastFocus) lastFocus.focus();
  lastFocus = null;
}

document.querySelectorAll('[data-modal]').forEach(el=>{
  el.addEventListener('click', e=>{
    e.stopPropagation();
    const hit = el.dataset.hit !== undefined ? Number(el.dataset.hit) : null;
    openModal(el.dataset.modal, el, hit);
  });
});

document.getElementById('close').addEventListener('click', closeModal);
layer.addEventListener('mousedown', e=>{ if(e.target === layer) closeModal(); });

document.addEventListener('keydown', e=>{
  if(!layer.classList.contains('open')) return;
  if(e.key === 'Escape'){ closeModal(); return; }
  if(e.key !== 'Tab') return;
  // foco atrapado dentro del modal
  const f = card.querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])');
  if(!f.length) return;
  const first = f[0], last = f[f.length-1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

// enlace directo a un modal: index.html?ver=gestion
const deep = new URLSearchParams(location.search).get('ver');
if(deep && DATA[deep]) openModal(deep, null, null);

/* =========================================================
   Contadores
   ========================================================= */
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!reduce){
  document.querySelectorAll('.num[data-to]').forEach((el, i)=>{
    const to = Number(el.dataset.to);
    const dur = 1100, delay = 260 + i*90;
    el.textContent = '0';
    setTimeout(()=>{
      const t0 = performance.now();
      const tick = now=>{
        const p = Math.min((now - t0) / dur, 1);
        const e = 1 - Math.pow(1 - p, 3);          // ease-out cúbico
        el.textContent = Math.round(to * e);
        if(p < 1) requestAnimationFrame(tick);
        else el.textContent = to;
      };
      requestAnimationFrame(tick);
    }, delay);
  });
}
</script>
