<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semáforo — Visitas de Asesoría</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='oklch(46%25 0.09 250)'/%3E%3Cpath d='M16 24.5s6.2-6.3 6.2-10.7A6.2 6.2 0 1 0 9.8 13.8C9.8 18.2 16 24.5 16 24.5Z' fill='white'/%3E%3Ccircle cx='16' cy='13.6' r='2.3' fill='oklch(46%25 0.09 250)'/%3E%3C/svg%3E">
</head>
<body data-tool="visitas">

<div class="topbar">
  <div class="topbar-head">
    <div class="tool-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-7.58 7-12.5A7 7 0 0 0 5 9.5C5 14.42 12 22 12 22Z"/><circle cx="12" cy="9.5" r="2.3"/></svg>
    </div>
    <div>
      <div class="brand">Comité de Cafeteros de Caldas — Evidencia para decidir</div>
      <h1>Semáforo de Visitas</h1>
    </div>
  </div>
  <nav>
    <a href="index.html">Formulario</a>
    <a href="semaforo.html" class="is-active">Semáforo</a>
    <a href="compromisos.html">Compromisos</a>
  </nav>
</div>

<div class="page">
  <div class="page-head">
    <div class="kicker">Panel en vivo</div>
    <h2>¿Cómo están las sedes visitadas?</h2>
    <p class="page-lede">Se actualiza automáticamente cada 30 segundos. Si una sede tiene varias visitas, se muestra la más reciente.</p>
  </div>

  <div class="kpi-grid" id="kpiGrid"></div>

  <div class="filters">
    <select id="filterProvincia"><option value="">Todas las provincias</option></select>
    <select id="filterCalificacion">
      <option value="">Todas las calificaciones</option>
      <option value="VERDE">Verde</option>
      <option value="AMARILLO">Amarillo</option>
      <option value="ROJO">Rojo</option>
    </select>
    <input type="text" id="filterBusqueda" placeholder="Buscar institución o sede...">
  </div>

  <div id="loader" class="loader">Cargando…</div>
  <div class="entity-grid" id="entityGrid"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-panel">
    <div class="modal-close" id="modalClose">✕</div>
    <div id="modalBody"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="semaforo.js"></script>
</body>
</html>
